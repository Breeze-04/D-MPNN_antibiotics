<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description">
  <title id="title">Baseline and attentive D-MPNN architecture comparison</title>
  <desc id="description">Two controlled Chemprop regression architectures. Both use molecular graph featurization, three-step directed bond message passing, and a one-hidden-layer RegressionFFN. Baseline uses mean aggregation; Attention uses learned atom weights followed by a weighted sum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#566774"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23313B" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #25333D; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #667682; }
      .panel-title { font-size: 25px; font-weight: 700; }
      .panel-subtitle { font-size: 15px; fill: #667682; }
      .box-title { font-size: 18px; font-weight: 700; }
      .box-note { font-size: 14px; fill: #5E6D78; }
      .formula { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 19px; }
      .small { font-size: 13px; fill: #667682; }
      .arrow { stroke: #566774; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .shared { fill: #F3F8F8; stroke: #4A9291; stroke-width: 2; }
      .baseline { fill: #EEF6FC; stroke: #2878B5; stroke-width: 2.5; }
      .attention { fill: #FFF4E9; stroke: #E67E22; stroke-width: 2.5; }
      .output { fill: #F4F1FA; stroke: #7357A5; stroke-width: 2; }
      .inner { fill: #FFFFFF; stroke: #E7B27E; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Transparent canvas: intentionally no background rectangle. -->
  <text x="900" y="48" class="title" text-anchor="middle">D-MPNN Baseline vs Attention</text>
  <text x="900" y="78" class="subtitle" text-anchor="middle">Controlled ablation: the aggregation operation is the only architectural change</text>

  <!-- Legend -->
  <rect x="550" y="99" width="24" height="16" rx="4" class="shared"/>
  <text x="583" y="112" class="small">shared component</text>
  <rect x="757" y="99" width="24" height="16" rx="4" class="baseline"/>
  <text x="790" y="112" class="small">mean aggregation</text>
  <rect x="974" y="99" width="24" height="16" rx="4" class="attention"/>
  <text x="1007" y="112" class="small">attentive aggregation</text>

  <!-- Panel headings -->
  <text x="450" y="158" class="panel-title" text-anchor="middle">Baseline</text>
  <text x="450" y="183" class="panel-subtitle" text-anchor="middle">BondMessagePassing → MeanAggregation → RegressionFFN</text>
  <text x="1350" y="158" class="panel-title" text-anchor="middle">Attention</text>
  <text x="1350" y="183" class="panel-subtitle" text-anchor="middle">BondMessagePassing → AttentiveAggregation → RegressionFFN</text>
  <line x1="900" y1="142" x2="900" y2="1060" stroke="#D7E0E5" stroke-width="1.5" stroke-dasharray="6 7"/>

  <!-- Baseline molecular graph icon and input -->
  <g transform="translate(192,230)">
    <line x1="18" y1="26" x2="62" y2="8" stroke="#4A9291" stroke-width="4"/>
    <line x1="18" y1="26" x2="53" y2="65" stroke="#4A9291" stroke-width="4"/>
    <line x1="62" y1="8" x2="103" y2="33" stroke="#4A9291" stroke-width="4"/>
    <line x1="53" y1="65" x2="103" y2="33" stroke="#4A9291" stroke-width="4"/>
    <line x1="103" y1="33" x2="139" y2="65" stroke="#4A9291" stroke-width="4"/>
    <circle cx="18" cy="26" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
    <circle cx="62" cy="8" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
    <circle cx="53" cy="65" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
    <circle cx="103" cy="33" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
    <circle cx="139" cy="65" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
  </g>
  <rect x="360" y="218" width="350" height="86" rx="14" class="shared" filter="url(#shadow)"/>
  <text x="535" y="251" class="box-title" text-anchor="middle">Molecular graph input</text>
  <text x="535" y="277" class="box-note" text-anchor="middle">canonical SMILES → atoms + directed bonds</text>

  <!-- Attention molecular graph icon and input -->
  <g transform="translate(1092,230)">
    <line x1="18" y1="26" x2="62" y2="8" stroke="#4A9291" stroke-width="4"/>
    <line x1="18" y1="26" x2="53" y2="65" stroke="#4A9291" stroke-width="4"/>
    <line x1="62" y1="8" x2="103" y2="33" stroke="#4A9291" stroke-width="4"/>
    <line x1="53" y1="65" x2="103" y2="33" stroke="#4A9291" stroke-width="4"/>
    <line x1="103" y1="33" x2="139" y2="65" stroke="#4A9291" stroke-width="4"/>
    <circle cx="18" cy="26" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
    <circle cx="62" cy="8" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
    <circle cx="53" cy="65" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
    <circle cx="103" cy="33" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
    <circle cx="139" cy="65" r="12" fill="#FFFFFF" stroke="#4A9291" stroke-width="3"/>
  </g>
  <rect x="1260" y="218" width="350" height="86" rx="14" class="shared" filter="url(#shadow)"/>
  <text x="1435" y="251" class="box-title" text-anchor="middle">Molecular graph input</text>
  <text x="1435" y="277" class="box-note" text-anchor="middle">canonical SMILES → atoms + directed bonds</text>

  <!-- Arrows to message passing -->
  <path d="M450 304 L450 344" class="arrow"/>
  <path d="M1350 304 L1350 344" class="arrow"/>

  <!-- D-MPNN blocks -->
  <rect x="195" y="350" width="510" height="136" rx="16" class="shared" filter="url(#shadow)"/>
  <text x="450" y="383" class="box-title" text-anchor="middle">Directed bond message passing</text>
  <text x="450" y="411" class="formula" text-anchor="middle">h<tspan baseline-shift="sub" font-size="13">vw</tspan><tspan baseline-shift="baseline"> ← f(h</tspan><tspan baseline-shift="sub" font-size="13">vw</tspan><tspan baseline-shift="baseline">, Σ h</tspan><tspan baseline-shift="sub" font-size="13">uv</tspan><tspan baseline-shift="baseline">)</tspan></text>
  <text x="450" y="446" class="box-note" text-anchor="middle">BondMessagePassing · hidden dimension 300 · depth 3</text>
  <text x="450" y="468" class="small" text-anchor="middle">messages follow directed bonds and exclude immediate backtracking</text>

  <rect x="1095" y="350" width="510" height="136" rx="16" class="shared" filter="url(#shadow)"/>
  <text x="1350" y="383" class="box-title" text-anchor="middle">Directed bond message passing</text>
  <text x="1350" y="411" class="formula" text-anchor="middle">h<tspan baseline-shift="sub" font-size="13">vw</tspan><tspan baseline-shift="baseline"> ← f(h</tspan><tspan baseline-shift="sub" font-size="13">vw</tspan><tspan baseline-shift="baseline">, Σ h</tspan><tspan baseline-shift="sub" font-size="13">uv</tspan><tspan baseline-shift="baseline">)</tspan></text>
  <text x="1350" y="446" class="box-note" text-anchor="middle">BondMessagePassing · hidden dimension 300 · depth 3</text>
  <text x="1350" y="468" class="small" text-anchor="middle">messages follow directed bonds and exclude immediate backtracking</text>

  <path d="M450 486 L450 526" class="arrow"/>
  <path d="M1350 486 L1350 526" class="arrow"/>

  <!-- Atom representations -->
  <rect x="235" y="532" width="430" height="78" rx="14" class="shared"/>
  <text x="450" y="563" class="box-title" text-anchor="middle">Final atom representations</text>
  <text x="450" y="589" class="formula" text-anchor="middle">H = {h<tspan baseline-shift="sub" font-size="13">v</tspan><tspan baseline-shift="baseline"> ∈ ℝ</tspan><tspan baseline-shift="super" font-size="13">300</tspan><tspan baseline-shift="baseline">}</tspan></text>

  <rect x="1135" y="532" width="430" height="78" rx="14" class="shared"/>
  <text x="1350" y="563" class="box-title" text-anchor="middle">Final atom representations</text>
  <text x="1350" y="589" class="formula" text-anchor="middle">H = {h<tspan baseline-shift="sub" font-size="13">v</tspan><tspan baseline-shift="baseline"> ∈ ℝ</tspan><tspan baseline-shift="super" font-size="13">300</tspan><tspan baseline-shift="baseline">}</tspan></text>

  <path d="M450 610 L450 650" class="arrow"/>
  <path d="M1350 610 L1350 650" class="arrow"/>

  <!-- Baseline aggregation -->
  <rect x="195" y="656" width="510" height="190" rx="17" class="baseline" filter="url(#shadow)"/>
  <text x="450" y="690" class="box-title" text-anchor="middle">MeanAggregation</text>
  <text x="450" y="727" class="formula" text-anchor="middle">h<tspan baseline-shift="sub" font-size="13">mol</tspan><tspan baseline-shift="baseline"> = (1 / |V|) Σ</tspan><tspan baseline-shift="sub" font-size="13">v∈V</tspan><tspan baseline-shift="baseline"> h</tspan><tspan baseline-shift="sub" font-size="13">v</tspan></text>
  <g transform="translate(292,761)">
    <circle cx="0" cy="0" r="15" fill="#9BC7E6"/><circle cx="48" cy="0" r="15" fill="#9BC7E6"/><circle cx="96" cy="0" r="15" fill="#9BC7E6"/><circle cx="144" cy="0" r="15" fill="#9BC7E6"/>
    <text x="0" y="5" font-size="12" text-anchor="middle">¼</text><text x="48" y="5" font-size="12" text-anchor="middle">¼</text><text x="96" y="5" font-size="12" text-anchor="middle">¼</text><text x="144" y="5" font-size="12" text-anchor="middle">¼</text>
    <path d="M176 0 L228 0" class="arrow"/>
    <circle cx="259" cy="0" r="25" fill="#2878B5"/>
    <text x="259" y="6" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">h</text>
  </g>
  <text x="450" y="821" class="box-note" text-anchor="middle">every atom receives the same fixed weight</text>

  <!-- Attention aggregation, expanded -->
  <rect x="1000" y="656" width="700" height="190" rx="17" class="attention" filter="url(#shadow)"/>
  <text x="1350" y="687" class="box-title" text-anchor="middle">AttentiveAggregation</text>
  <rect x="1027" y="706" width="170" height="74" rx="11" class="inner"/>
  <text x="1112" y="734" class="box-title" text-anchor="middle">Score atoms</text>
  <text x="1112" y="760" class="formula" text-anchor="middle">s<tspan baseline-shift="sub" font-size="13">v</tspan><tspan baseline-shift="baseline"> = W h</tspan><tspan baseline-shift="sub" font-size="13">v</tspan><tspan baseline-shift="baseline"> + b</tspan></text>
  <path d="M1197 743 L1235 743" class="arrow"/>
  <rect x="1242" y="706" width="182" height="74" rx="11" class="inner"/>
  <text x="1333" y="734" class="box-title" text-anchor="middle">Normalize</text>
  <text x="1333" y="760" class="formula" text-anchor="middle">α = softmax(s)</text>
  <path d="M1424 743 L1462 743" class="arrow"/>
  <rect x="1469" y="706" width="204" height="74" rx="11" class="inner"/>
  <text x="1571" y="734" class="box-title" text-anchor="middle">Weighted sum</text>
  <text x="1571" y="760" class="formula" text-anchor="middle">h<tspan baseline-shift="sub" font-size="13">mol</tspan><tspan baseline-shift="baseline"> = Σ α</tspan><tspan baseline-shift="sub" font-size="13">v</tspan><tspan baseline-shift="baseline">h</tspan><tspan baseline-shift="sub" font-size="13">v</tspan></text>
  <text x="1350" y="812" class="box-note" text-anchor="middle">learned molecule-specific atom weights · 301 additional parameters</text>
  <text x="1350" y="833" class="small" text-anchor="middle">single-head attentive pooling — not a Transformer</text>

  <path d="M450 846 L450 881" class="arrow"/>
  <path d="M1350 846 L1350 881" class="arrow"/>

  <!-- Predictor blocks -->
  <rect x="230" y="887" width="440" height="91" rx="14" class="shared" filter="url(#shadow)"/>
  <text x="450" y="920" class="box-title" text-anchor="middle">RegressionFFN</text>
  <text x="450" y="948" class="box-note" text-anchor="middle">300 → hidden 300 → 1 · ReLU · dropout 0.0</text>

  <rect x="1130" y="887" width="440" height="91" rx="14" class="shared" filter="url(#shadow)"/>
  <text x="1350" y="920" class="box-title" text-anchor="middle">RegressionFFN</text>
  <text x="1350" y="948" class="box-note" text-anchor="middle">300 → hidden 300 → 1 · ReLU · dropout 0.0</text>

  <path d="M450 978 L450 1013" class="arrow"/>
  <path d="M1350 978 L1350 1013" class="arrow"/>

  <!-- Outputs -->
  <rect x="275" y="1019" width="350" height="66" rx="33" class="output"/>
  <text x="450" y="1047" class="box-title" text-anchor="middle">Predicted log₂(MIC)</text>
  <text x="450" y="1069" class="small" text-anchor="middle">continuous regression output</text>

  <rect x="1175" y="1019" width="350" height="66" rx="33" class="output"/>
  <text x="1350" y="1047" class="box-title" text-anchor="middle">Predicted log₂(MIC)</text>
  <text x="1350" y="1069" class="small" text-anchor="middle">continuous regression output</text>

  <text x="900" y="1106" class="small" text-anchor="middle">Same input data, random split (seed 42), D-MPNN depth, hidden dimensions, FFN, optimizer schedule, and training protocol</text>
</svg>
